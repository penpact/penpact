services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: penpact
      POSTGRES_PASSWORD: penpact
      POSTGRES_DB: penpact
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpact"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - penpact_pgdata:/var/lib/postgresql/data

volumes:
  penpact_pgdata:
